<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="vyankatesh's pond: automating the boring stuff since 2023" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14505f"/>
      <stop offset="1" stop-color="#08212b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#3fb8b0" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3fb8b0" stop-opacity="0"/>
    </radialGradient>
    <g id="pad">
      <path d="M0 0 L19 -7 A20 20 0 1 1 7 -19 Z" fill="#2f9e6a"/>
      <path d="M0 0 L19 -7 A20 20 0 1 1 7 -19 Z" fill="none" stroke="#1f6f4a" stroke-width="1.2"/>
    </g>
    <g id="lotus">
      <ellipse cx="0" cy="-7" rx="3.2" ry="8" fill="#ffb3c7"/>
      <ellipse cx="0" cy="-7" rx="3.2" ry="8" fill="#ff8fab" transform="rotate(-55)"/>
      <ellipse cx="0" cy="-7" rx="3.2" ry="8" fill="#ff8fab" transform="rotate(55)"/>
      <circle r="2.4" fill="#ffe08a"/>
    </g>
  </defs>

  <rect width="1000" height="230" rx="18" fill="url(#water)"/>
  <rect width="1000" height="230" rx="18" fill="url(#glow)"/>

  <!-- ripples -->
  <g fill="none" stroke="#8fe3dc" stroke-width="1.6">
    <circle cx="170" cy="150" r="0" opacity="0">
      <animate attributeName="r" values="0;70" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="150" r="0" opacity="0">
      <animate attributeName="r" values="0;70" dur="6s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0" dur="6s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="70" r="0" opacity="0">
      <animate attributeName="r" values="0;80" dur="7s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0" dur="7s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="70" r="0" opacity="0">
      <animate attributeName="r" values="0;80" dur="7s" begin="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0" dur="7s" begin="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="610" cy="185" r="0" opacity="0">
      <animate attributeName="r" values="0;55" dur="5s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;0" dur="5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- lily pads (bobbing) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 3;0 0" dur="5s" repeatCount="indefinite"/>
    <use href="#pad" transform="translate(70 60) scale(1.2)"/>
    <use href="#lotus" transform="translate(72 52)"/>
    <use href="#pad" transform="translate(120 178) rotate(140) scale(.9)"/>
    <use href="#pad" transform="translate(905 175) rotate(30) scale(1.3)"/>
    <use href="#lotus" transform="translate(907 168) scale(1.1)"/>
    <use href="#pad" transform="translate(940 95) rotate(200) scale(.8)"/>
    <use href="#pad" transform="translate(330 195) rotate(80) scale(.7)"/>
  </g>

  <!-- text -->
  <g text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,monospace">
    <text x="500" y="108" font-size="46" font-weight="700" fill="#ffffff">vyankatesh</text>
    <text x="500" y="146" font-size="16" fill="#8fe3dc">automating the boring stuff since 2023</text>
    <text x="500" y="178" font-size="12" fill="#ff8a5b" letter-spacing="3">PUNE · CS UNDERGRAD · BOT BUILDER</text>
  </g>
</svg>
