<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 110" width="1000" height="110" role="img" aria-label="Just a pond. The koi is redrawn every night." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14505f"/>
      <stop offset="1" stop-color="#08212b"/>
    </linearGradient>
  </defs>
  <rect y="30" width="1000" height="80" fill="url(#fw)"/>
  <g fill="url(#fw)" opacity=".85">
    <path d="M0 34 Q125 6 250 34 T500 34 T750 34 T1000 34 T1250 34 T1500 34 T1750 34 T2000 34 V110 H0 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-1000 0" dur="14s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#14505f" opacity=".6">
    <path d="M0 44 Q125 22 250 44 T500 44 T750 44 T1000 44 T1250 44 T1500 44 T1750 44 T2000 44 V110 H0 Z">
      <animateTransform attributeName="transform" type="translate" values="-1000 0;0 0" dur="18s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="500" y="82" text-anchor="middle" font-family="'Fira Code',Consolas,monospace" font-size="13" fill="#8fe3dc">just a pond. no real fish. the koi is redrawn every night at 00:20 UTC.</text>
</svg>
